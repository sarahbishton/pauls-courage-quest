<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paul's Courage Quest — Acts 14:19–20a</title><style>
:root{--ink:#20263b;--navy:#222c59;--purple:#6544b8;--gold:#f4b83e;--paper:#fffdf7;--green:#227b58;--red:#aa3850}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#d9e9fa,#f3e5fa 55%,#fff0cf);font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);min-height:100vh}main{max-width:950px;margin:auto;padding:20px 16px 45px}.hero{background:var(--navy);color:white;border-radius:22px;padding:24px 28px;box-shadow:0 9px 22px #26315b22}.hero h1{margin:0;font-size:clamp(1.8rem,5vw,2.8rem)}.hero p{margin:7px 0 0;color:#e7e5ff}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{background:white;padding:10px 15px;border-radius:14px;box-shadow:0 2px 8px #0001;font-weight:750}.stat span{color:var(--purple)}.progress{height:13px;background:#d8d9e6;border-radius:30px;overflow:hidden;margin:14px 0}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#6b4bc4,#f4b83e);transition:width .3s}.panel{background:var(--paper);border:2px solid #ffffff;border-radius:22px;padding:24px;box-shadow:0 10px 30px #222c591a;min-height:420px}h2{margin:0 0 12px;color:var(--navy)}h3{color:var(--navy)}.verse{background:#f1ecff;border-left:6px solid var(--purple);border-radius:12px;padding:16px 18px;font-size:1.08rem;line-height:1.65}.muted{color:#566079}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:12px 17px;background:var(--purple);color:white;font-weight:750;font-size:1rem;cursor:pointer;min-height:44px}.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e8e4f5;color:#30275c}.btn.gold{background:#e9a725;color:#29200b}.btn.choice{background:#fff;color:var(--navy);border:2px solid #d6d4e6;text-align:left}.btn.choice:hover{border-color:var(--purple)}.btn.correct{background:#d5f5e5;border-color:var(--green);color:#145b40}.btn.wrong{background:#ffe1e7;border-color:var(--red);color:#8e233a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}.chunk{background:#fff;border:2px solid #e4dcf9;border-radius:14px;padding:14px;font-weight:650;line-height:1.4}.chunk small{display:block;color:var(--purple);margin-bottom:5px}.feedback{margin:16px 0;padding:12px 14px;border-radius:12px;background:#e9f5ff;font-weight:650;min-height:48px}.feedback.good{background:#def7e8;color:#135b3b}.feedback.bad{background:#fff0d6;color:#6b4512}.tokens{display:flex;flex-wrap:wrap;gap:9px;margin:13px 0}.token{background:white;border:2px solid #bfb2e7;color:#282047;border-radius:11px;padding:10px 13px;cursor:pointer;font-size:.97rem;font-weight:650;min-height:43px}.token:disabled{opacity:.35;cursor:default}.slots{background:#f2effb;border:2px dashed #a594d5;border-radius:14px;padding:14px;min-height:75px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.slot{background:#ddd4f4;border-radius:9px;padding:9px 12px;font-weight:650}.hidden{display:none!important}.question{font-size:1.25rem;font-weight:750;margin:15px 0}.badge{display:inline-block;background:#fff0c1;border:2px solid #e9ba46;padding:9px 13px;border-radius:40px;margin:5px;font-weight:750}.big{font-size:2rem}.center{text-align:center}.input{font:inherit;padding:12px;border:2px solid #bdb2df;border-radius:11px;width:100%;max-width:500px}.input:focus{outline:3px solid #c8b7ff}.footer{text-align:center;color:#5c6380;font-size:.88rem;margin-top:18px}.small{font-size:.92rem}.chip{background:#e7defc;color:#39266c;padding:4px 10px;border-radius:30px;font-size:.8rem;font-weight:800}.confetti{font-size:2.1rem;letter-spacing:8px}@media(max-width:550px){.panel{padding:16px}.hero{padding:20px}.btn{width:100%}.token{flex:1 1 auto}.controls .btn{width:auto}}
</style></head><body><main><header class="hero"><h1>🛡️ Paul's Courage Quest</h1><p>Acts 14:19–20a • Scripture Memory Adventure • Grade 4</p></header><div class="stats"><div class="stat">⭐ Stars: <span id="stars">0</span></div><div class="stat">🏅 Badges: <span id="badges">0</span>/5</div><div class="stat">🧭 Mission: <span id="mission">Welcome</span></div><div class="stat">⏱️ Time: <span id="clock">00:00</span></div></div><div class="progress"><div id="bar"></div></div><section class="panel" id="screen" aria-live="polite"></section><div class="footer">Study tip: Say the words aloud as you play. Your progress stays on this device until you refresh.</div></main><script>
const verse='Then some Jews came from Antioch and Iconium and won the crowd over. They stoned Paul and dragged him outside the city, thinking he was dead. But after the disciples had gathered around him, he got up and went back into the city';
const chunks=['Then some Jews came from Antioch and Iconium','and won the crowd over.','They stoned Paul and dragged him outside the city,','thinking he was dead.','But after the disciples had gathered around him,','he got up and went back into the city'];
const labels=['Who came?','What did they do?','What happened to Paul?','What did they think?','Who gathered around him?','What did Paul do?'];
let stage=0,stars=0,badges=[],start=null,seconds=0,completed=false;let questionIndex=0,answers=[],pool=[],selected=[],mistakes=0,helpUsed=false,round=0;
const $=id=>document.getElementById(id);const screen=$('screen');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function update(){ $('stars').textContent=stars;$('badges').textContent=badges.length;$('mission').textContent=['Welcome','Discover','Story Puzzle','Missing Words','Memory Challenge','Final Boss','Victory'][stage];$('bar').style.width=(stage/6*100)+'%'}
function tick(){if(!start||completed)return;seconds=Math.floor((Date.now()-start)/1000);$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
setInterval(tick,1000);
function award(n){stars+=n;update()}
function badge(name){if(!badges.includes(name)){badges.push(name);update()}}
function feedback(msg,good=true){let el=$('feedback');if(el){el.textContent=msg;el.className='feedback '+(good?'good':'bad')}}
function next(){stage++;questionIndex=0;mistakes=0;helpUsed=false;update();render()}
function welcome(){screen.innerHTML=`<h2>🎒 Your mission starts here!</h2><p>Help remember the true Bible account of Paul. Travel through <strong>five missions</strong>: discover the verse, put the story in order, fill missing words, answer from memory, and face the Final Boss!</p><div class="verse">“${esc(verse)}.” <strong>(Acts 14:19–20a)</strong></div><p>⭐ Earn stars for correct answers. 🏅 Unlock five badges. Mistakes are okay—you can try again!</p><p class="muted small">Plan for about 15 minutes. There is no countdown or penalty for taking your time.</p><div class="controls"><button class="btn gold" onclick="begin()">🚀 Start Adventure</button></div>`}
function begin(){start=Date.now();next()}
function discover(){screen.innerHTML=`<h2>🔎 Mission 1: Scripture Explorer</h2><p>Read each chunk aloud. The story has <strong>six parts</strong>. Notice the names, the surprising ending, and what happens first.</p><div class="grid">${chunks.map((c,i)=>`<div class="chunk"><small>${i+1}. ${labels[i]}</small>${esc(c)}</div>`).join('')}</div><p class="muted">Memory trick: <strong>Visitors → Crowd → Paul → Thought → Disciples → Returned</strong></p><div class="controls"><button class="btn secondary" onclick="toggleVerse()">👀 Show / hide full verse</button><button class="btn gold" onclick="award(10);badge('Scripture Explorer');next()">I read it! +10 ⭐</button></div><div id="verseExtra" class="verse hidden">${esc(verse)}. (Acts 14:19–20a)</div>`}
function toggleVerse(){$('verseExtra').classList.toggle('hidden')}
function puzzleSetup(){selected=[];pool=shuffle(chunks.map((t,i)=>({t,i})));puzzleRender()}
function puzzleRender(){screen.innerHTML=`<h2>🧩 Mission 2: Story Sequence Puzzle</h2><p>Tap the story pieces in the <strong>correct order</strong>. Use the clue words you just learned.</p><h3>Your story (${selected.length}/6)</h3><div class="slots">${selected.length?selected.map((x,i)=>`<button class="token" onclick="undo(${i})" title="Remove this piece">${i+1}. ${esc(chunks[x])} ✕</button>`).join(''):'Tap a piece below to begin…'}</div><h3>Story pieces</h3><div class="tokens">${pool.filter(x=>!selected.includes(x.i)).map(x=>`<button class="token" onclick="pick(${x.i})">${esc(x.t)}</button>`).join('')}</div><div id="feedback" class="feedback">Put all six pieces in order, then check your answer.</div><div class="controls"><button class="btn" ${selected.length!==6?'disabled':''} onclick="checkPuzzle()">Check my story</button><button class="btn secondary" onclick="puzzleSetup()">Shuffle / start over</button></div>`}
function pick(i){selected.push(i);puzzleRender()}
function undo(i){selected.splice(i,1);puzzleRender()}
function checkPuzzle(){let correct=selected.every((v,i)=>v===i);if(correct){award(Math.max(15,40-mistakes*5));badge('Story Solver');screen.innerHTML+=`<div class="feedback good">🎉 Perfect story order! You earned stars and the Story Solver badge.</div><button class="btn gold" onclick="next()">Next mission →</button>`;screen.querySelectorAll('button').forEach(b=>{if(!b.textContent.includes('Next mission'))b.disabled=true})}else{mistakes++;feedback('Not quite! Hint: First people arrived, and last Paul went back into the city. Tap pieces to rearrange.',false)}}
const missing=[{q:'Then some Jews came from ______ and Iconium',a:'Antioch',options:['Jerusalem','Antioch','Bethlehem','Rome']},{q:'and won the ______ over.',a:'crowd',options:['crowd','king','soldiers','disciples']},{q:'They stoned Paul and dragged him ______ the city,',a:'outside',options:['through','inside','outside','above']},{q:'thinking he was ______.',a:'dead',options:['asleep','lost','dead','afraid']},{q:'But after the ______ had gathered around him,',a:'disciples',options:['guards','disciples','merchants','rulers']},{q:'he got up and went ______ into the city.',a:'back',options:['away','slowly','back','down']}];
function missingRender(){if(questionIndex>=missing.length){badge('Word Detective');screen.innerHTML=`<h2>🏅 Word Detective badge unlocked!</h2><p>You finished all six missing-word clues.</p><div class="verse">${esc(verse)}. (Acts 14:19–20a)</div><button class="btn gold" onclick="next()">Go to Memory Challenge →</button>`;return}let q=missing[questionIndex];screen.innerHTML=`<h2>🔤 Mission 3: Missing-Word Maze</h2><p class="muted">Clue ${questionIndex+1} of 6 • Choose the <strong>exact word</strong> from the verse.</p><div class="question">${esc(q.q)}</div><div class="grid">${shuffle(q.options).map(a=>`<button class="btn choice" onclick="answerMissing(this,${JSON.stringify(a).replace(/"/g,'&quot;')})">${esc(a)}</button>`).join('')}</div><div id="feedback" class="feedback">Choose a word to continue.</div><div class="controls"><button class="btn secondary" onclick="showHint()">💡 Hint (no penalty)</button><button class="btn gold hidden" id="continue" onclick="questionIndex++;missingRender()">Next clue →</button></div>`}
function showHint(){feedback('Hint: The answer begins with “'+missing[questionIndex].a[0]+'”.')}
function answerMissing(btn,a){let q=missing[questionIndex];if(a===q.a){btn.classList.add('correct');award(10);feedback('Correct! “'+q.a+'” is the exact word. +10 ⭐');screen.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('continue').classList.remove('hidden')}else{btn.disabled=true;btn.classList.add('wrong');feedback('Try again. Read the whole phrase and think about what makes sense.',false)}}
const quiz=[{q:'Which two places did the Jews come from?',a:'Antioch and Iconium',opts:['Antioch and Iconium','Rome and Egypt','Jerusalem and Bethlehem']},{q:'What did they win over?',a:'The crowd',opts:['The guards','The crowd','The disciples']},{q:'What did the people think about Paul?',a:'He was dead',opts:['He was hiding','He was dead','He was traveling']},{q:'Who gathered around Paul?',a:'The disciples',opts:['The soldiers','The disciples','The rulers']},{q:'What did Paul do after he got up?',a:'Went back into the city',opts:['Went back into the city','Ran to the sea','Stayed outside the city']}];
function quizRender(){if(questionIndex>=quiz.length){badge('Courage Champion');screen.innerHTML=`<h2>🛡️ Courage Champion!</h2><p>You've remembered the key events. Think about Paul's courage and the disciples who gathered around him.</p><div class="feedback good">⭐ Keep going—one final memory challenge awaits.</div><button class="btn gold" onclick="next()">Face the Final Boss →</button>`;return}let q=quiz[questionIndex];screen.innerHTML=`<h2>🧠 Mission 4: Memory Challenge</h2><p class="muted">Question ${questionIndex+1} of ${quiz.length} • No verse shown this round!</p><div class="question">${esc(q.q)}</div><div class="grid">${shuffle(q.opts).map(a=>`<button class="btn choice" onclick="answerQuiz(this,${JSON.stringify(a).replace(/"/g,'&quot;')})">${esc(a)}</button>`).join('')}</div><div id="feedback" class="feedback">Remember the story before you answer.</div><button id="continue" class="btn gold hidden" onclick="questionIndex++;quizRender()">Next question →</button>`}
function answerQuiz(btn,a){let q=quiz[questionIndex];if(a===q.a){btn.classList.add('correct');award(15);feedback('You remembered! +15 ⭐');screen.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('continue').classList.remove('hidden')}else{btn.classList.add('wrong');btn.disabled=true;feedback('Try again. Think back to the six story chunks.',false)}}
const bossPrompts=[{prompt:'Then some Jews came from',answer:'Antioch and Iconium',hint:'Two places: A_____ and I_____'},{prompt:'They stoned Paul and dragged him',answer:'outside the city',hint:'Where did they drag him?'},{prompt:'But after the disciples had gathered around him,',answer:'he got up and went back into the city',hint:'He got __ and went ____ into the city'}];
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function bossRender(){if(questionIndex>=bossPrompts.length){badge('Verse Master');next();return}let q=bossPrompts[questionIndex];screen.innerHTML=`<h2>👑 Mission 5: Final Boss</h2><p>Type the missing words from memory. Spelling and word order matter, but capitalization and punctuation don't.</p><p class="muted">Round ${questionIndex+1} of 3</p><div class="verse">${esc(q.prompt)} <strong>__________</strong></div><div class="controls"><input class="input" id="typed" aria-label="Missing words" placeholder="Type the missing words here" autocomplete="off" spellcheck="false"><button class="btn" onclick="checkBoss()">Check answer</button></div><div id="feedback" class="feedback">You can do it! Try without peeking.</div><div class="controls"><button class="btn secondary" onclick="feedback(${JSON.stringify(q.hint)})">💡 Give me a clue</button><button class="btn secondary" onclick="revealBoss()">Show answer (practice mode)</button><button id="continue" class="btn gold hidden" onclick="questionIndex++;bossRender()">Continue →</button></div>`;$('typed').addEventListener('keydown',e=>{if(e.key==='Enter')checkBoss()})}
function checkBoss(){let q=bossPrompts[questionIndex],v=$('typed').value;if(normalize(v)===normalize(q.answer)){award(25);feedback('Excellent! You remembered the exact words. +25 ⭐');$('continue').classList.remove('hidden');$('typed').disabled=true;screen.querySelectorAll('button').forEach(b=>{if(b.id!=='continue')b.disabled=true})}else{feedback('Almost! Check your words and try again. Hint: '+q.hint,false)}}
function revealBoss(){let q=bossPrompts[questionIndex];$('typed').value=q.answer;feedback('Practice answer shown. Read it aloud, then press Check answer. You can still finish!')}
function victory(){completed=true;tick();screen.innerHTML=`<div class="center"><div class="confetti">🎉 ⭐ 🎉</div><h2>🏆 YOU ARE A VERSE MASTER!</h2><p class="big">${stars} ⭐</p><p>You completed all five missions and unlocked ${badges.length} badges!</p><div>${badges.map(x=>`<span class="badge">🏅 ${esc(x)}</span>`).join('')}</div></div><h3>Say the entire verse aloud one more time:</h3><div class="verse">“${esc(verse)}.” <strong>(Acts 14:19–20a)</strong></div><h3>💭 Think about it</h3><p>Paul experienced something frightening, but he got up and returned to the city. What does this account show you about courage and perseverance? How did the disciples show that Paul was not alone?</p><div class="controls"><button class="btn gold" onclick="restart()">🔁 Play again</button><button class="btn secondary" onclick="window.print()">🖨️ Print my victory</button></div>`}
function restart(){stage=0;stars=0;badges=[];start=null;seconds=0;completed=false;questionIndex=0;update();$('clock').textContent='00:00';render()}
function render(){update();if(stage===0)welcome();else if(stage===1)discover();else if(stage===2)puzzleSetup();else if(stage===3)missingRender();else if(stage===4)quizRender();else if(stage===5)bossRender();else victory()}
render();
</script></body></html>
